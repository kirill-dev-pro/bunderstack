version: 2
generator:
  name: bunderstack
  version: 1.0.0-beta.2
application:
  framework: bun-ssr
  scripts:
    build: build
  worker:
    main: src/worker.ts
    compatibilityDate: 2026-09-27
    assets: public
bunderstack:
  entry: src/bunderstack.ts
  manifestVersion: 4
resources:
  database:
    dialect: sqlite
    migrationsDirectory: ./migrations
    migrationMode: push
    tables:
      - exportName: _system.idempotency
        physicalName: _bunderstack_idempotency
        system: true
      - exportName: _system.jobs
        physicalName: _bunderstack_jobs
        system: true
      - exportName: _system.messageEvents
        physicalName: _bunderstack_message_events
        system: true
      - exportName: _system.messages
        physicalName: _bunderstack_messages
        system: true
      - exportName: account
        physicalName: account
        system: false
      - exportName: _system.files
        physicalName: bunderstack_file_meta
        system: true
      - exportName: events
        physicalName: events
        system: false
      - exportName: notes
        physicalName: notes
        system: false
      - exportName: session
        physicalName: session
        system: false
      - exportName: user
        physicalName: user
        system: false
      - exportName: verification
        physicalName: verification
        system: false
  storage:
    defaultBucket: media
    buckets:
      - name: media
        visibility: private
  realtime:
    required: true
  messaging:
    channels: []
environment:
  - key: APP_URL
    required: false
    scope: server
    sensitive: true
api:
  operations:
    - handle: enqueueNote
      operationId: enqueueNote
      effect: mutation
      method: POST
      path: /api/probe/enqueue
background:
  jobs:
    - name: noteCreated
  cron:
    - name: bunderstack:storage-sweep
      schedule: "0 4 * * *"
      timezone: UTC
    - name: everyMinute
      schedule: "* * * * *"
      timezone: UTC
  maintenance:
    - name: storage-sweep
      schedule: "0 4 * * *"
      timezone: UTC
