version: 1
authentication:
  managedIdentity:
    protocolVersion: 2
    adapterVersion: 2
    discovery: true
    callbackPath: /api/auth/callback/bunderhost
generator:
  name: bunderstack
  version: 0.33.1
application:
  framework: tanstack-start
  scripts:
    build: build
    start: start
    worker: worker
bunderstack:
  entry: src/bunderstack/backend.ts
  manifestVersion: 4
resources:
  database:
    dialect: sqlite
    migrationsDirectory: ./migrations
    migrationMode: migrations
    tables:
      - exportName: _system.broadcastRecipients
        physicalName: _bunderstack_broadcast_recipients
        system: true
      - exportName: _system.broadcasts
        physicalName: _bunderstack_broadcasts
        system: true
      - exportName: _system.contactAddresses
        physicalName: _bunderstack_contact_addresses
        system: true
      - exportName: _system.contactTags
        physicalName: _bunderstack_contact_tags
        system: true
      - exportName: _system.contacts
        physicalName: _bunderstack_contacts
        system: true
      - exportName: _system.idempotency
        physicalName: _bunderstack_idempotency
        system: true
      - exportName: _system.jobs
        physicalName: _bunderstack_jobs
        system: true
      - exportName: _system.messageEvents
        physicalName: _bunderstack_message_events
        system: true
      - exportName: _system.messages
        physicalName: _bunderstack_messages
        system: true
      - exportName: _system.seed
        physicalName: _bunderstack_seed
        system: true
      - exportName: account
        physicalName: account
        system: false
      - exportName: attachments
        physicalName: attachments
        system: false
      - exportName: _system.files
        physicalName: bunderstack_file_meta
        system: true
      - exportName: projects
        physicalName: projects
        system: false
      - exportName: session
        physicalName: session
        system: false
      - exportName: tasks
        physicalName: tasks
        system: false
      - exportName: user
        physicalName: user
        system: false
      - exportName: verification
        physicalName: verification
        system: false
    seed: true
  storage:
    defaultBucket: project-files
    buckets:
      - name: project-files
        visibility: private
      - name: public
        visibility: public
  realtime:
    required: true
  messaging:
    channels:
      - name: email
        kind: email
        provider: managed
      - name: inbox
        kind: email
        provider: managed
        receive: true
      - name: news
        kind: email
        provider: managed
environment:
  - key: BUNDERHOST_AUTH_CONFIG
    required: false
    scope: server
    sensitive: true
  - key: EMAIL_FROM
    required: false
    scope: server
    sensitive: true
  - key: PUBLIC_APP_NAME
    required: false
    scope: client
    sensitive: false
  - key: REDIS_URL
    required: false
    scope: server
    sensitive: true
  - key: TASKS_WEBHOOK_SECRET
    required: false
    scope: server
    sensitive: true
api:
  operations:
    - handle: addTask
      operationId: addTask
      effect: mutation
      method: POST
      path: /api/add-task
    - handle: adminOverview
      operationId: adminOverview
      effect: read
      method: GET
      path: /api/admin/overview
    - handle: attachFile
      operationId: attachFile
      effect: mutation
      method: POST
      path: /api/projects/{projectId}/attachments
    - handle: completeTask
      operationId: completeTask
      effect: mutation
      method: POST
      path: /api/tasks/{taskId}/complete
    - handle: createProject
      operationId: createProject
      effect: mutation
      method: POST
      path: /api/create-project
    - handle: projectInbox
      operationId: projectInbox
      effect: read
      method: GET
      path: /api/projects/{projectId}/inbox
    - handle: removeAttachment
      operationId: removeAttachment
      effect: mutation
      method: POST
      path: /api/attachments/{attachmentId}/remove
    - handle: requestDigest
      operationId: requestDigest
      effect: mutation
      method: POST
      path: /api/projects/{projectId}/digest
    - handle: setProjectCover
      operationId: setProjectCover
      effect: mutation
      method: POST
      path: /api/projects/{projectId}/cover
    - handle: subscribeToNews
      operationId: subscribeToNews
      effect: mutation
      method: POST
      path: /api/subscribe-to-news
    - handle: taskWebhook
      operationId: taskWebhook
      effect: mutation
      method: POST
      path: /api/webhooks/tasks
background:
  worker:
    required: true
  jobs:
    - name: sendProjectDigest
    - name: taskFromEmail
  cron:
    - name: archiveCompletedTasks
      schedule: "0 3 * * *"
      timezone: UTC
    - name: bunderstack:storage-sweep
      schedule: "0 4 * * *"
      timezone: UTC
  maintenance:
    - name: storage-sweep
      schedule: "0 4 * * *"
      timezone: UTC
