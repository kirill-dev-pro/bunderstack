server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json text/plain text/xml application/xml application/manifest+json image/svg+xml;

    # Asset filenames carry a content hash, so they never change in place.
    # `^~` stops the image/font regex below from claiming these and cutting
    # their cache lifetime down to a day.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The prerendered search index is a file without an extension. Without an
    # explicit type nginx serves it as application/octet-stream and the docs
    # search stops working.
    location = /api/search {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Logos, social cards and favicons are stable files without a content hash.
    # A day of caching keeps repeat visits and card scrapers off the origin
    # while still letting a redesign propagate quickly.
    location ~* \.(?:png|webp|avif|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Crawler-facing files: short cache, correct type. Without the explicit
    # type nginx serves .webmanifest as application/octet-stream and Chrome
    # ignores it.
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        add_header Cache-Control "no-cache";
        # Prerendered pages are directories (docs/auth/index.html). Anything
        # else is an unknown URL: nginx answers 404 and the shell boots the
        # client router, which renders the 404 route. Serving it as 200 would
        # make every typo a soft 404 in Search Console.
        try_files $uri $uri/index.html =404;
    }

    # The SPA shell is the 404 body, never a page of its own — it carries a
    # noindex tag and no content until the router hydrates.
    error_page 404 /_shell.html;

    location = /_shell.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
