server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    # Asset filenames carry a content hash, so they never change in place.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The prerendered search index is a file without an extension. Without an
    # explicit type nginx serves it as application/octet-stream and the docs
    # search stops working.
    location = /api/search {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        # Prerendered pages are directories (docs/auth/index.html); the last
        # fallback hands client-side routes to the SPA shell.
        try_files $uri $uri/index.html /index.html;
    }
}
